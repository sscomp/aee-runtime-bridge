; AEE Runtime Bridge — supervisord unit
;
; Why supervisord (not systemd)?
;   The Abacus.AI host uses supervisord (PID 7) as its service supervision
;   tree, NOT systemd. `systemctl enable` does not work here — there is no
;   user-systemd, and `Failed to connect to bus: Host is down` will fire.
;
; Install (already done on 2026-07-07):
;   1. This file copied to /etc/supervisor/conf.d/hermes-runtime-bridge.conf
;   2. sudo supervisorctl reread
;   3. sudo supervisorctl update
;
; Logs:
;   /var/log/hermes-runtime-bridge.out.log
;   /var/log/hermes-runtime-bridge.err.log
;
; Rollback:
;   sudo supervisorctl stop hermes-runtime-bridge
;   sudo rm /etc/supervisor/conf.d/hermes-runtime-bridge.conf
;   sudo supervisorctl update

[program:hermes-runtime-bridge]
command=/home/ubuntu/hermes-runtime-bridge/.venv/bin/uvicorn app:app
    --host 127.0.0.1
    --port 8787
    --env-file /home/ubuntu/hermes-runtime-bridge/.env
    --no-access-log
directory=/home/ubuntu/hermes-runtime-bridge
user=ubuntu
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stopsignal=TERM
stdout_logfile=/var/log/hermes-runtime-bridge.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/hermes-runtime-bridge.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
priority=20
