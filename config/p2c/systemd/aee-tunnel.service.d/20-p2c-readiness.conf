# Candidate drop-in for EXISTING USER aee-tunnel.service; do not install in Stage 1.
# system and user managers cannot directly express cross-manager Requires.
# Remove the old user gateway dependency only during reviewed cutover.
[Unit]
Requires=
Wants=network-online.target
After=
After=network-online.target
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
ExecStartPre=/opt/aee/venvs/mcp-py313/bin/python -m aee.mcp_runtime.readiness --port 8791 --timeout 30 --manifest /opt/aee/current/deployment-manifest.json
WorkingDirectory=/opt/aee/current/source
TimeoutStartSec=45
Restart=on-failure
RestartSec=2
