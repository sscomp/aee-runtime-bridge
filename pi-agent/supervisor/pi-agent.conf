; AEE-4 Part B — Pi Worker supervisord unit
;
; The Abacus.AI host uses supervisord (PID 7), NOT systemd.
; systemctl enable does not work here. This is the production
; unit for the Pi Worker daemon.
;
; Install (one-time):
;   1. Copy this file to /etc/supervisor/conf.d/pi-agent.conf
;   2. Ensure the bridge (hermes-runtime-bridge) is also
;      managed by supervisord at priority 20 — Pi Worker is
;      priority 30, so it starts after the bridge.
;   3. sudo supervisorctl reread
;   4. sudo supervisorctl update
;
; Logs:
;   /var/log/pi-agent.out.log
;   /var/log/pi-agent.err.log
;
; Rollback:
;   sudo supervisorctl stop pi-agent
;   sudo rm /etc/supervisor/conf.d/pi-agent.conf
;   sudo supervisorctl update

[program:pi-agent]
command=/home/ubuntu/hermes-runtime-bridge/.venv/bin/python
    -u
    /home/ubuntu/hermes-runtime-bridge/pi-agent/pi_worker.py
    --config /home/ubuntu/hermes-runtime-bridge/pi-agent/config.yaml
directory=/home/ubuntu/hermes-runtime-bridge
user=ubuntu
autostart=true
autorestart=true
startsecs=10
startretries=3
; The daemon may be in the middle of a job when SIGTERM
; arrives. Give it time to flush the final heartbeat and
; call /v1/jobs/{id}/fail. 15s is the default; the
; runtime's per-job timeout is 900s, so a job that's still
; running will be force-killed by the kernel after 15s.
; The bridge reaper then reaps the Job to `timeout` per
; the AEE-4 Worker Runtime Contract §6.
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=/var/log/pi-agent.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/pi-agent.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
; Start after the bridge (priority 20).
priority=30
