; AEE-4 Part B — AEE Lightweight Agent Runtime supervisord unit
;
; The Abacus.AI host uses supervisord (PID 7), NOT systemd.
; systemctl enable does not work here. This is the production
; unit for the AEE Lightweight Agent Runtime daemon.
;
; Install (one-time):
;   1. Copy this file to /etc/supervisor/conf.d/aee-runtime.conf
;   2. Ensure the bridge (hermes-runtime-bridge) is also
;      managed by supervisord at priority 20 — the runtime
;      is priority 30, so it starts after the bridge.
;   3. sudo supervisorctl reread
;   4. sudo supervisorctl update
;
; Logs:
;   /var/log/aee-runtime.out.log
;   /var/log/aee-runtime.err.log
;
; Rollback:
;   sudo supervisorctl stop aee-runtime
;   sudo rm /etc/supervisor/conf.d/aee-runtime.conf
;   sudo supervisorctl update

[program:aee-runtime]
command=/home/ubuntu/hermes-runtime-bridge/.venv/bin/python
    -u
    /home/ubuntu/hermes-runtime-bridge/aee-runtime/aee_runtime.py
    --config /home/ubuntu/hermes-runtime-bridge/aee-runtime/config.yaml
directory=/home/ubuntu/hermes-runtime-bridge
user=ubuntu
autostart=true
autorestart=true
startsecs=10
startretries=3
; The daemon may be in the middle of a job when SIGTERM
; arrives. Give it time to flush the final heartbeat and
; call /v1/jobs/{id}/fail. 15s is the default; the
; runtime's per-job timeout is 900s, so a job that's still
; running will be force-killed by the kernel after 15s.
; The bridge reaper then reaps the Job to `timeout` per
; the AEE-4 Worker Runtime Contract §6.
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=/var/log/aee-runtime.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/aee-runtime.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
; Start after the bridge (priority 20).
priority=30
