name: AEE CI Matrix (§21.7)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  profile-job:
    name: Profile ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
      env:
        AEE_DB_PATH: /tmp/aee-${{ matrix.profile }}.db
        AEE_PROFILE: ${{ matrix.profile }}
        PYTHONPATH: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            suite_kind: full
          - profile: mini
            suite_kind: subset
          - profile: edge
            suite_kind: subset
          - profile: developer
            suite_kind: subset

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        run: |
          python3 --version
          python3 -c "import unittest; print('unittest ok')"

      - name: Setup tempdir DB
        run: |
          mkdir -p /tmp
          echo "AEE_DB_PATH=$AEE_DB_PATH"
          rm -f "$AEE_DB_PATH" "$AEE_DB_PATH-wal" "$AEE_DB_PATH-shm" 2>/dev/null || true

      - name: Install (dry-run)
        run: bash install.sh --profile ${{ matrix.profile }} --dry-run

      - name: Profile CLI smoke
        run: python3 -m aee.cli --profile ${{ matrix.profile }} install --dry-run --json

      - name: Targeted tests (full suite)
        if: matrix.suite_kind == 'full'
        run: |
          PYTHONPATH=. python3 -m unittest discover -s aee/tests -p 'test_aee9*.py' -v

      - name: Targeted tests (mini subset)
        if: matrix.profile == 'mini'
        run: |
          PYTHONPATH=. python3 -m unittest \
            aee.tests.test_aee91_canonical_profile_matrix \
            aee.tests.test_aee92_unified_cli_ux \
            aee.tests.test_aee93_installer_backend \
            aee.tests.test_aee96_provider_neutral_deployment \
            aee.tests.test_aee97_cicd_matrix \
            -v

      - name: Targeted tests (edge subset)
        if: matrix.profile == 'edge'
        run: |
          PYTHONPATH=. python3 -m unittest \
            aee.tests.test_aee91_canonical_profile_matrix \
            aee.tests.test_aee93_installer_backend \
            aee.tests.test_aee94_runtime_profile_selection \
            aee.tests.test_aee95_docker_profiles \
            aee.tests.test_aee96_provider_neutral_deployment \
            aee.tests.test_aee97_cicd_matrix \
            -v

      - name: Targeted tests (developer subset)
        if: matrix.profile == 'developer'
        run: |
          PYTHONPATH=. python3 -m unittest \
            aee.tests.test_aee91_canonical_profile_matrix \
            aee.tests.test_aee92_unified_cli_ux \
            aee.tests.test_aee93_installer_backend \
            aee.tests.test_aee95_docker_profiles \
            aee.tests.test_aee96_provider_neutral_deployment \
            aee.tests.test_aee97_cicd_matrix \
            -v

      - name: Shell wrapper regression
        run: bash tests/test_install_shell_wrapper.sh

  mcp-runtime:
    name: MCP runtime, packaging and public-source gates
    # Jammy's bwrap 0.6.1 lacks --size; systemd 249 cannot verify our %d unit.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixture prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap gcc systemd apparmor
      - name: Prepare runner sandbox fixtures
        run: |
          bwrap --version
          systemd-analyze --version
          # CI VM only: Noble restricts namespace capabilities unless the
          # sandbox helper has an explicit userns profile. Keep the global
          # AppArmor restriction enabled and scope the grant to /usr/bin/bwrap.
          # https://documentation.ubuntu.com/release-notes/24.04/
          for profile in /etc/apparmor.d/bwrap /etc/apparmor.d/bwrap-userns-restrict; do
            if [ -f "$profile" ]; then
              sudo apparmor_parser -R "$profile"
            fi
          done
          cat > "$RUNNER_TEMP/aee-ci-bwrap.apparmor" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile aee-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r "$RUNNER_TEMP/aee-ci-bwrap.apparmor"
          sysctl kernel.apparmor_restrict_unprivileged_userns
          # CI only: the reviewed sandbox uses /lib64 -> /usr/lib. Ubuntu's
          # loader lives in a multiarch directory; provide its equivalent alias
          # for fixture ELF/prlimit execution without changing the runtime view.
          if [ ! -e /usr/lib/ld-linux-x86-64.so.2 ]; then
            test -f /usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
            sudo ln -s x86_64-linux-gnu/ld-linux-x86-64.so.2 /usr/lib/ld-linux-x86-64.so.2
          fi
          # Probe the real fixture sandbox before discovery collapses its
          # startup errors into AGENT_UNAVAILABLE. No credentials or model.
          python - <<'PY'
          import subprocess, sys, tempfile
          from pathlib import Path
          from aee.mcp_runtime.process import Limits, run_bounded
          from aee.mcp_runtime.sandbox import sandbox_command
          with tempfile.TemporaryDirectory(prefix='aee-ci-sandbox-') as name:
              root = Path(name)
              binary = root / 'codex'
              workspace = root / 'source'
              workspace.mkdir()
              subprocess.run(['gcc', '-O2', 'tests/mcp/fixtures/codex_probe.c', '-o', str(binary)], check=True)
              limits = Limits(timeout=5)
              result = run_bounded(sandbox_command(binary, workspace, ['/runner/codex', '--version'], limits), env={}, limits=limits)
              sys.stdout.write(result.stdout.decode(errors='replace'))
              sys.stderr.write(result.stderr.decode(errors='replace'))
              if result.returncode:
                  raise SystemExit(result.returncode)
              assert result.stdout.startswith(b'codex-cli ')
          PY
      - name: Install hashed MCP closure
        run: python -m pip install --require-hashes -r requirements-mcp.lock
      - name: Import and packaging CLI smoke
        run: |
          python -m compileall -q aee/mcp_runtime mcp_gateway.py
          python -m aee.mcp_runtime.packaging --help
      - name: Current MCP, job, broker and packaging regression
        run: PYTHONPATH=.:tests/mcp python -m unittest discover -s tests/mcp -p 'test_*.py' -v
      - name: Current adapters and bootstrap lifecycle
        run: >-
          PYTHONPATH=. python -m unittest
          aee.tests.test_dispatch_service aee.tests.test_exec_provider
          aee.tests.test_claude_code_provider aee.tests.test_selector_claude_code
          aee.tests.test_bootstrap_runner aee.tests.test_aee7_orchestrator_e2e -v
      - name: Canonical documentation and config contract
        run: python scripts/check-canonical-docs.py
      - name: Clean checkout packaging smoke
        run: python scripts/smoke-canonical-package.py
      - name: Public source secret gate
        run: python scripts/scan-aee-baseline-secrets.py

  compatibility-api:
    name: Supported HTTP API and job lifecycle
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install hashed API closure
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Isolated API and job lifecycle regression
        run: >-
          PYTHONPATH=.:tests python -m unittest
          test_jobs_api test_workers_api test_aee5_job_lifecycle -v

  merge-gate:
    name: Merge Gate (all active contracts green)
    runs-on: ubuntu-latest
    needs: [profile-job, mcp-runtime, compatibility-api]
    if: ${{ always() }}
    steps:
      - name: Enforce all-green
        run: |
          set -e
          echo "profile-job result: ${{ needs.profile-job.result }}"
          if [ "${{ needs.profile-job.result }}" != "success" ] || [ "${{ needs.mcp-runtime.result }}" != "success" ] || [ "${{ needs.compatibility-api.result }}" != "success" ]; then
            echo "::error::§21.7 merge gate failed: profile-job did not succeed (got ${{ needs.profile-job.result }}). All 4 profiles, MCP and HTTP API must be green for merge to main."
            exit 1
          fi
          echo "Merge gate: all active contracts green. Reviewer approval still required."
